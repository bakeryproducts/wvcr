[build-system]
requires = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wvcr"
version = "0.1.0"
authors = [
    {name = "Your Name"}
]
description = "Voice recording and transcription tool"
requires-python = ">=3.9"
dependencies = [
    "pyaudio",
    "loguru",
    "openai>=1.75.0",
    "pyperclip",
    "google-genai",
    "pynput",
    "python-dotenv",
    "plyer",
    "requests",
    "yt-dlp",
  "ffmpeg-python",
  "fire",
  "google-adk",
  "textual>=0.50.0",
  "httpx>=0.27.0",
  "websockets>=12.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
wayland = ["evdev"]

[project.scripts]
# Daemon-based architecture
wvcr-daemon = "wvcr.daemon.server:main"
wvcr-ctl = "wvcr.daemon.control:main"
wvcr = "wvcr.cli.client:main"
wvcr-tui = "wvcr.tui.main:main"
wvcr-translate = "wvcr.translate.cli:main"
wvcr-hint = "wvcr.hint.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["wvcr"]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  "."
]
